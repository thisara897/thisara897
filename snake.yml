# Put this file at: .github/workflows/snake.yml
#
# Before it works:
#   Repo → Settings → Actions → General → Workflow permissions
#   → tick "Read and write permissions" → Save
#
# Then: Actions tab → "Generate Snake" → Run workflow (to build it immediately).
# After that it rebuilds itself every night at midnight UTC.

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=6C5CE7&color_dots=#f0f0f0,#c4b5fd,#a78bfa,#8b5cf6,#00E5A0
            dist/github-snake-dark.svg?color_snake=00E5A0&color_dots=#161b22,#3b2f63,#5b47a3,#6C5CE7,#00E5A0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update snake animation [skip ci]"
